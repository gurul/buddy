<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>buddy</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1b1b1f);
    --hint: var(--tg-theme-hint-color, #8a8a92);
    --link: var(--tg-theme-link-color, #2f6fde);
    --accent: var(--tg-theme-button-color, #2f6fde);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --bubble: var(--tg-theme-secondary-bg-color, #f1f1f4);
    --code: rgba(127, 127, 127, 0.14);
    --danger: var(--tg-theme-destructive-text-color, #d93838);
    --sheet: var(--tg-theme-secondary-bg-color, #f1f1f4);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--tg-theme-bg-color, #17171b); --text: var(--tg-theme-text-color, #ececf1);
      --hint: var(--tg-theme-hint-color, #8d8d96); --bubble: var(--tg-theme-secondary-bg-color, #232329);
      --link: var(--tg-theme-link-color, #6ea2ff); --accent: var(--tg-theme-button-color, #3e7bf0);
      --danger: var(--tg-theme-destructive-text-color, #ff6b6b); --sheet: var(--tg-theme-secondary-bg-color, #232329);
    }
  }
  * { box-sizing: border-box; }
  /* --app-h: the visible height (the phone's keyboard taken off), so a composer at the bottom stays above it */
  html, body { margin: 0; height: var(--app-h, 100%); background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 16px; border-bottom: 1px solid var(--code); }
  header .who { font-weight: 600; font-size: 17px; margin: 0; }
  header .spent { color: var(--hint); font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; }
  header button { background: none; border: 0; color: var(--link); font: inherit; padding: 6px 0; }
  .empty { color: var(--hint); text-align: center; margin-top: 30vh; }
  form { display: flex; gap: 8px; align-items: flex-end; padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--code); background: var(--bg); }
  textarea { flex: 1; resize: none; max-height: 40vh; border: 1px solid var(--code); border-radius: 18px;
    padding: 9px 14px; background: var(--bubble); color: var(--text); font: inherit; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  form button { border: 0; border-radius: 18px; background: var(--accent); color: var(--accent-text);
    font: 600 15px system-ui, sans-serif; padding: 10px 16px; min-height: 40px; }
  form button:focus-visible, header button:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  form button:disabled { opacity: 0.5; }
  [hidden] { display: none !important; }
  #apps { flex: 1; overflow-y: auto; padding: 16px; }
  .make { background: var(--bubble); border-radius: 16px; padding: 14px; margin-bottom: 18px; }
  .make label { display: block; font-weight: 600; margin-bottom: 8px; }
  .make textarea { width: 100%; min-height: 64px; background: var(--bg); }
  .make .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; }
  .make .row span { color: var(--hint); font-size: 13px; }
  .btn { border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-text);
    font: 600 15px system-ui, sans-serif; padding: 10px 16px; min-height: 44px; }
  .btn:disabled { opacity: .5; }
  .btn:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .ideas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .ideas button { border: 1px solid var(--code); background: var(--bg); color: var(--text); border-radius: 999px;
    padding: 6px 12px; font: 14px system-ui, sans-serif; min-height: 34px; }
  h2.section { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); margin: 0 0 8px; }
  .app { display: flex; align-items: center; gap: 4px; padding: 10px 4px 10px 12px; border-radius: 14px;
    background: var(--bubble); margin-bottom: 8px; }
  .icon { width: 44px; height: 44px; border-radius: 12px; background: var(--bg); color: var(--text);
    display: grid; place-items: center; font: 24px/1 system-ui, sans-serif; flex: none; }
  .icon.letter { background: var(--accent); color: var(--accent-text); font: 700 19px system-ui, sans-serif; }
  .app .text { display: block; min-width: 0; }
  .app .name { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .app .desc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    color: var(--hint); font-size: 14px; line-height: 1.35; }
  .app .when { display: block; color: var(--hint); font-size: 12px; margin-top: 2px; }
  .app .open { flex: 1; min-width: 0; background: none; border: 0; text-align: left; color: inherit; font: inherit;
    display: flex; align-items: center; gap: 12px; padding: 0; min-height: 44px; border-radius: 10px; }
  .app .more { flex: none; width: 44px; height: 44px; border: 0; border-radius: 22px; background: none;
    color: var(--link); font: 700 20px/1 system-ui, sans-serif; letter-spacing: 1px; }
  .app .open:focus-visible, .app .more:focus-visible,
  .sheet button:focus-visible, .sheet input:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .none { color: var(--hint); }
  .make[aria-busy="true"] textarea { opacity: .7; }
  .notice-row { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; }
  .notice-row:has(.notice:empty) { display: none; }
  .notice { color: var(--hint); font-size: 14px; margin: 0; flex: 1; min-width: 0; }
  .notice:empty { display: none; }
  .notice-row button { background: none; border: 0; color: var(--link); font: 600 15px system-ui, sans-serif;
    min-height: 44px; padding: 0 8px; }
  .result { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .result .btn.plain { background: none; color: var(--link); padding: 10px 8px; }
  .app .more:disabled { color: var(--hint); }
  .sheet[aria-busy="true"] .actions button, .sheet[aria-busy="true"] .rename .btn { opacity: .5; }
  .notice-row button:focus-visible, .result .btn:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* the "…" action sheet: a native <dialog> (focus trapped, Escape closes), laid out like a phone's sheet */
  dialog.sheet { margin: auto auto 0; width: 100%; max-width: 520px; border: 0; padding: 0; background: transparent;
    color: var(--text); }
  dialog.sheet::backdrop { background: rgba(0, 0, 0, .35); }
  .sheet .panel { background: var(--bg); border-radius: 16px 16px 0 0;
    padding: 14px 12px calc(12px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 24px rgba(0,0,0,.18); }
  .sheet .head { display: flex; align-items: center; gap: 12px; padding: 2px 4px 12px; }
  .sheet h2 { font-size: 17px; margin: 0; overflow-wrap: anywhere; }
  .sheet .actions { background: var(--sheet); border-radius: 12px; overflow: hidden; }
  .sheet .actions button { display: block; width: 100%; min-height: 50px; border: 0; background: none;
    color: var(--link); font: 17px system-ui, sans-serif; text-align: center; }
  .sheet .actions button + button { border-top: 1px solid var(--code); }
  .sheet .actions button.danger { color: var(--danger); }
  .sheet .cancel { display: block; width: 100%; min-height: 50px; margin-top: 8px; border: 0; border-radius: 12px;
    background: var(--sheet); color: var(--link); font: 600 17px system-ui, sans-serif; }
  .sheet .rename { background: var(--sheet); border-radius: 12px; padding: 12px; }
  .sheet .rename label { display: block; font-weight: 600; margin-bottom: 8px; }
  .sheet .rename input { width: 100%; min-height: 44px; border: 1px solid var(--code); border-radius: 10px;
    padding: 8px 12px; background: var(--bg); color: var(--text); font: inherit; }
  .sheet .rename .row { display: flex; justify-content: flex-end; margin-top: 10px; }
  .sheet .error { color: var(--danger); font-size: 14px; margin: 8px 4px 0; }
  .sheet .error:empty { display: none; }
  /* one app's change chat (?chat=<slug>): what was asked of it, how each build went, and the next change */
  body.chatting > header, body.chatting #apps { display: none; }
  #chat { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .chat-head { display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 4px;
    border-bottom: 1px solid var(--code); }
  .chat-head .back { flex: none; width: 44px; height: 44px; border: 0; border-radius: 22px; background: none;
    color: var(--link); font: 32px/1 system-ui, sans-serif; padding: 0 0 4px; }
  .chat-head .icon { width: 36px; height: 36px; border-radius: 10px; font-size: 20px; }
  .chat-head .icon.letter { font-size: 16px; }
  .chat-name { flex: 1; min-width: 0; }
  .chat-name h1 { font-size: 17px; line-height: 1.3; margin: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; outline: none; }
  .chat-name span { display: block; color: var(--hint); font-size: 13px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-variant-numeric: tabular-nums; }
  .chat-head .btn { flex: none; padding: 8px 14px; }
  .thread { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; list-style: none; margin: 0;
    padding: 14px 12px 10px; display: flex; flex-direction: column; gap: 8px; }
  .thread .quiet { color: var(--hint); text-align: center; margin: auto 16px; font-size: 15px; }
  .msg { max-width: 86%; padding: 8px 12px; border-radius: 18px; overflow-wrap: anywhere; line-height: 1.4; }
  .msg.asked { align-self: flex-end; background: var(--accent); color: var(--accent-text);
    border-bottom-right-radius: 6px; white-space: pre-wrap; }
  .msg.built { align-self: flex-start; background: var(--bubble); border-bottom-left-radius: 6px; }
  .msg.built.failed .line { color: var(--danger); }
  .msg.built[aria-busy="true"] .line { color: var(--hint); font-variant-numeric: tabular-nums; }
  .msg .line { display: block; }
  .msg .more-line { display: block; font-size: 14px; color: var(--hint); margin-top: 2px; }
  .msg .when { display: block; font-size: 12px; margin-top: 3px; opacity: .72; font-variant-numeric: tabular-nums; }
  .msg.built .when { color: var(--hint); opacity: 1; }
  .msg.note { align-self: center; max-width: 92%; background: none; color: var(--hint); font-size: 13px;
    text-align: center; padding: 2px 8px; }
  .msg .btn { margin: 8px 6px 0 0; }
  .msg .btn.plain { background: none; color: var(--link); padding: 10px 8px; }
  .chat-hint { margin: 0; padding: 6px 16px 0; color: var(--hint); font-size: 13px; }
  .chat-hint:empty { display: none; }
  .chat-head .back:focus-visible, .chat-head .btn:focus-visible, .msg .btn:focus-visible {
    outline: 2px solid var(--link); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) {
    dialog.sheet[open] .panel { animation: rise .18s ease-out; }
    @keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
  }
</style>
</head>
<body>
<header>
  <h1 class="who">Your apps</h1>
  <div class="spent" id="spent" role="status" aria-live="polite"></div>
</header>
<section id="apps">
  <div class="make" id="make-card">
    <label for="want" id="want-label">What should I build?</label>
    <textarea id="want" rows="2" placeholder="A habit tracker with daily check-ins and streaks"></textarea>
    <div class="ideas" id="ideas">
      <button type="button">Habit tracker with streaks</button>
      <button type="button">Workout log</button>
      <button type="button">Reading list</button>
      <button type="button">Expense splitter</button>
    </div>
    <div class="row"><span id="make-status"></span>
      <button class="btn" id="make" type="button">Build it</button></div>
    <div class="result" id="make-result" hidden></div>
    <div class="sr" id="make-live" role="status" aria-live="polite"></div>
  </div>
  <h2 class="section" id="apps-heading" tabindex="-1">Your apps</h2>
  <div class="notice-row"><p class="notice" id="apps-notice" role="status" aria-live="polite"></p>
    <button type="button" id="notice-undo" hidden>Undo</button></div>
  <div id="app-list"><div class="none">Nothing yet. Describe one above.</div></div>
</section>
<section id="chat" aria-labelledby="chat-title" hidden>
  <div class="chat-head">
    <button type="button" class="back" id="chat-back" aria-label="Back to your apps"><span aria-hidden="true">‹</span></button>
    <span class="icon" id="chat-icon" aria-hidden="true"></span>
    <div class="chat-name"><h1 id="chat-title" tabindex="-1"></h1><span id="chat-sub"></span></div>
    <button type="button" class="btn" id="chat-open">Open</button>
  </div>
  <ol class="thread" id="thread" aria-label="What was asked of this app and how each change went"></ol>
  <p class="chat-hint" id="chat-hint"></p>
  <form id="composer">
    <label class="sr" for="ask">What should change?</label>
    <textarea id="ask" rows="1" maxlength="4000" enterkeyhint="send" placeholder="What should change?"></textarea>
    <button type="submit" id="ask-send">Change</button>
  </form>
  <div class="sr" id="chat-live" role="status" aria-live="polite"></div>
</section>
<dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
  <div class="panel">
    <div class="head"><span class="icon" id="sheet-icon" aria-hidden="true"></span><h2 id="sheet-title"></h2></div>
    <div class="actions" id="sheet-actions">
      <button type="button" data-act="change">Change</button>
      <button type="button" data-act="rename">Rename</button>
      <button type="button" data-act="undo" id="act-undo">Undo last change</button>
      <button type="button" data-act="delete" class="danger">Delete</button>
    </div>
    <form class="rename" id="sheet-rename" hidden>
      <label for="rename-input">New name</label>
      <input id="rename-input" maxlength="60" autocomplete="off" enterkeyhint="done">
      <div class="row"><button class="btn" type="submit" id="rename-save">Save</button></div>
    </form>
    <p class="error" id="sheet-error" role="alert"></p>
    <button type="button" class="cancel" id="sheet-cancel">Cancel</button>
  </div>
</dialog>
<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const initData = tg ? tg.initData : "";
  if (tg) { tg.ready(); tg.expand(); }
  const $ = (id) => document.getElementById(id);
  const spent = $("spent");
  const can = (v) => !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v));
  // What today's building has cost. Spend is tracked, not capped, unless a cap was set.
  function showSpent(d) {
    if (!d || typeof d.spent_today !== "number") return;
    spent.textContent = "$" + d.spent_today.toFixed(2) + (typeof d.cap === "number" ? " of $" + d.cap.toFixed(2) : "") + " spent today";
  }

  if (!initData) { spent.textContent = "Open this from buddy's pinned message in Telegram."; $("make").disabled = true; }
  else fetch("api/me", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ initData }) })
    .then((r) => r.json()).then((j) => { if (j.error) spent.textContent = j.error; else showSpent(j); }).catch(() => {});

  // ---- apps ----
  // App titles and descriptions come from pages Claude wrote, so they only ever reach the page as textContent.
  const want = $("want"), makeBtn = $("make"), makeStatus = $("make-status"), makeLive = $("make-live");
  const notice = $("apps-notice"), sheet = $("sheet"), noticeUndo = $("notice-undo"), result = $("make-result");
  let building = false, apps = [], running = [], poll = null;
  const query = new URLSearchParams(location.search);
  const opening = query.get("open");                    // an Open button from the chat
  const chatting = query.get("chat");                   // a Change button, or an app's pencil or Settings item
  const ago = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString(undefined, { month: "short", day: "numeric" }); };
  async function post(path, body) {
    return fetch(path, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ initData }, body || {})) });
  }
  async function reply(r) { let j = {}; try { j = await r.json(); } catch (e) {} return j; }
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function iconFor(a, node) {                           // the app's emoji, else its first letter on a tile
    const emoji = (a.icon || "").trim();
    node.textContent = emoji || (a.title || "?").trim().charAt(0).toUpperCase() || "?";
    node.classList.toggle("letter", !emoji);
    return node;
  }
  function haptic(kind) { try { if (can("6.1")) tg.HapticFeedback.notificationOccurred(kind); } catch (e) {} }
  // Yes/no before anything that cannot be undone from here: Telegram's popup with the action named on a red
  // button, else Telegram's plain confirm, else the browser's.
  function ask(text, yes) {
    return new Promise((resolve) => {
      if (can("6.2") && tg.showPopup) {
        try { tg.showPopup({ message: text, buttons: [{ id: "yes", type: "destructive", text: yes }, { id: "no", type: "cancel" }] },
          (id) => resolve(id === "yes")); return; } catch (e) {}
      }
      if (can("6.2") && tg.showConfirm) { try { tg.showConfirm(text, (ok) => resolve(!!ok)); return; } catch (e) {} }
      resolve(window.confirm(text));
    });
  }
  // An app opens sandboxed with its own app token (the server's "open" address), never with the owner's
  // initData. Telegram's script in it reads its version, platform and theme from the address, as Telegram
  // passes them to a Mini App, and the owner's first name for a greeting: nothing signed.
  function tgHash() {
    if (!tg) return "";
    const p = [], put = (k, v) => p.push(k + "=" + encodeURIComponent(v));
    const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (user && user.first_name) put("tgWebAppData", "user=" + encodeURIComponent(JSON.stringify({ first_name: user.first_name })));
    if (tg.version) put("tgWebAppVersion", tg.version);
    if (tg.platform) put("tgWebAppPlatform", tg.platform);
    if (tg.themeParams) put("tgWebAppThemeParams", JSON.stringify(tg.themeParams));
    return p.length ? "#" + p.join("&") : "";
  }
  const openApp = (url, replace) => { const to = url.replace(/^\//, "") + tgHash(); if (replace) location.replace(to); else location.href = to; };

  const changingNow = () => new Set(running.map((b) => b.app).filter(Boolean));
  function renderApps() {
    const list = $("app-list"); list.textContent = "";
    if (!apps.length) { list.appendChild(el("div", "none", "Nothing yet. Describe one above.")); return; }
    const busy = changingNow();
    apps.forEach((a) => {
      const row = el("div", "app"); row.dataset.slug = a.slug;
      const open = el("button", "open"); open.type = "button";
      open.appendChild(iconFor(a, el("span", "icon"))).setAttribute("aria-hidden", "true");
      const text = el("span", "text");
      text.appendChild(el("span", "name", a.title));
      if (a.description) text.appendChild(el("span", "desc", a.description));
      text.appendChild(el("span", "when", busy.has(a.slug) ? "Being changed…" : "Updated " + ago(a.updated)));
      open.appendChild(text);
      open.onclick = () => openApp(a.open);
      const more = el("button", "more", "…"); more.type = "button";
      more.setAttribute("aria-label", "More for " + a.title + (busy.has(a.slug) ? " (being changed)" : ""));
      more.setAttribute("aria-haspopup", "dialog");
      more.disabled = busy.has(a.slug);                  // Change, Undo and Delete wait for its build
      more.onclick = () => openSheet(a, more);
      row.append(open, more);
      list.appendChild(row);
    });
  }
  async function loadApps() {
    if (!initData) return;
    try {
      const j = await reply(await post("api/apps"));
      if (Array.isArray(j.apps)) { apps = j.apps; running = Array.isArray(j.building) ? j.building : []; renderApps(); watchRunning(); paintComposer(); }
    } catch (e) {}
  }
  // A build this page did not start, or whose stream dropped (a locked phone): it keeps running on the Mac,
  // and its result goes to the chat with buddy. Until it ends, the page says so and Build waits for it.
  function watchRunning() {
    const mine = running.find((b) => b.secs != null);
    if (building) return;
    if (mine) {
      const t0 = Date.now() - mine.secs * 1000, what = mine.request ? "“" + mine.request + "”" : "a change";
      const paint = () => { makeStatus.textContent = "Still building " + what + "… " + clock(Date.now() - t0); };
      paint(); makeBtn.disabled = true;
      if (!poll) poll = setInterval(() => { paint(); loadApps(); }, 4000);
    } else if (poll) {
      clearInterval(poll); poll = null; makeBtn.disabled = !initData;
      makeStatus.textContent = "Finished. buddy sent the result to the chat.";
    }
  }

  // ---- the "…" sheet: Change, Rename, Undo last change, Delete ----
  let current = null, trigger = null;
  function openSheet(a, from) {
    current = a; trigger = from;
    $("sheet-title").textContent = a.title;
    iconFor(a, $("sheet-icon"));
    $("act-undo").hidden = !(a.versions > 0);
    $("sheet-actions").hidden = false; $("sheet-rename").hidden = true; $("sheet-error").textContent = "";
    if (sheet.showModal) sheet.showModal(); else sheet.setAttribute("open", "");
    sheet.querySelector("[data-act]").focus();
    if (can("6.1")) { tg.BackButton.onClick(closeSheet); tg.BackButton.show(); }
  }
  function closeSheet() { if (sheet.open) { if (sheet.close) sheet.close(); else sheet.removeAttribute("open"); } }
  sheet.addEventListener("close", () => {
    // The close event comes after Change has opened the app's chat, whose Back button stays.
    if (can("6.1")) { tg.BackButton.offClick(closeSheet); if (!chat) tg.BackButton.hide(); }
    // Focus goes back to the "…" that opened the sheet, or to the list when that row is gone.
    const back = trigger && document.body.contains(trigger) && !trigger.disabled ? trigger : $("apps-heading");
    if (sheet.dataset.keepFocus) delete sheet.dataset.keepFocus; else back.focus();
  });
  sheet.addEventListener("click", (e) => { if (e.target === sheet) closeSheet(); });   // a tap on the backdrop
  $("sheet-cancel").onclick = closeSheet;
  function sheetError(text) { $("sheet-error").textContent = text; haptic("error"); }
  // One action at a time: while it is on its way over the tunnel the sheet's buttons wait, so a second tap
  // cannot send a second undo (an undo is a pop; the server also refuses a stale one by its version count).
  async function act(path, body, fail, doing) {
    const buttons = sheet.querySelectorAll("#sheet-actions button, #rename-save");
    buttons.forEach((b) => { b.disabled = true; }); sheet.setAttribute("aria-busy", "true");
    $("sheet-error").textContent = doing || "";
    try {
      const r = await post("api/apps/" + encodeURIComponent(current.slug) + "/" + path, body);
      const j = await reply(r);
      if (!r.ok) { sheetError(j.error || fail); if (r.status === 409 || r.status === 404) loadApps(); return null; }
      $("sheet-error").textContent = "";
      return j;
    } catch (e) { sheetError("The connection dropped. Try again."); return null; }
    finally { buttons.forEach((b) => { b.disabled = false; }); sheet.removeAttribute("aria-busy"); }
  }
  let undoTimer = null;
  function done(text, undo) {
    closeSheet(); notice.textContent = text; haptic("success"); loadApps();
    clearTimeout(undoTimer); noticeUndo.hidden = !undo; noticeUndo.onclick = undo || null;
    if (undo) undoTimer = setTimeout(() => { noticeUndo.hidden = true; }, 15000);
  }

  $("sheet-actions").addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-act]"); if (!b || !current || b.disabled) return;
    const a = current, which = b.dataset.act;
    if (which === "change") {
      sheet.dataset.keepFocus = "1"; closeSheet(); openChat(a.slug, true); return;
    }
    if (which === "rename") {
      $("sheet-actions").hidden = true; $("sheet-rename").hidden = false;
      const input = $("rename-input"); input.value = a.title; input.focus(); input.select(); return;
    }
    if (which === "undo") {
      const older = a.undo_warning ? " Entries saved since that change may not open in the older version." : "";
      if (!(await ask("Undo the last change to " + a.title + "? The version you have now is not kept." + older, "Undo"))) return;
      if (await act("revert", { versions: a.versions }, "Couldn't undo that.", "Undoing…")) done(a.title + " is back to how it was before its last change.");
      return;
    }
    if (which === "delete") {
      if (!(await ask("Delete " + a.title + "? It goes to buddy's trash on the Mac, with its data, and Undo brings it back.", "Delete"))) return;
      if (await act("delete", {}, "Couldn't delete that.", "Deleting…")) {
        done("Deleted " + a.title + ".", async () => {
          noticeUndo.hidden = true;
          try {
            const r = await post("api/apps/" + encodeURIComponent(a.slug) + "/restore");
            const j = await reply(r);
            notice.textContent = r.ok ? a.title + " is back." : (j.error || "Couldn't bring it back.");
            haptic(r.ok ? "success" : "error");
          } catch (x) { notice.textContent = "The connection dropped. Try again."; }
          loadApps();
        });
      }
    }
  });
  $("sheet-rename").addEventListener("submit", async (e) => {
    e.preventDefault();
    const title = $("rename-input").value.trim(); if (!title || !current) return;
    const j = await act("rename", { title }, "Couldn't rename that.", "Renaming…");
    if (j) done("Renamed to " + j.app.title + ".");
  });

  // ---- building a new app ----
  $("ideas").querySelectorAll("button").forEach((b) => { b.onclick = () => { want.value = b.textContent; want.focus(); }; });

  // A build streams apps_maker's stages: thinking, writing (characters so far), testing, fixing (how many
  // problems the phone check found), saving. The words change at each stage; the clock runs beside them.
  const STAGES = {
    thinking: () => "Thinking it through…",
    writing: (n) => "Writing it…" + (n >= 1000 ? " " + Math.round(n / 1000) + "k" : ""),
    testing: () => "Testing it on a phone…",
    fixing: (n) => "Fixing " + n + (n === 1 ? " problem…" : " problems…"),
    saving: () => "Saving…",
  };
  const clock = (ms) => { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  // The finished build's line: plain words, the first thing that may not work named (the check's counts go to
  // the log, not here).
  function readyLine(r) {
    const title = r.app.title;
    if (!r.problems) return "Ready: " + title + (r.tested === false ? ". It could not be tested on a phone this time." : ". Tested on a phone.");
    const n = r.problems === 1 ? "1 thing" : r.problems + " things";
    return "Ready: " + title + ", but " + n + " may not work: " + ((r.issues && r.issues[0]) || "") ;
  }
  // The Open button under the line when the page does not open the new app by itself.
  function showResult(r) {
    result.textContent = "";
    const open = el("button", "btn", "Open " + r.app.title); open.type = "button";
    open.onclick = () => openApp(r.url);
    result.appendChild(open);
    result.hidden = false;
  }
  // One build or change over /api/make, its stream read to the end; say(words) hears each stage in words. The
  // answer is {got} (the done event), {failed} (the build's own error line), {refused, status} (it never
  // started: another build is running, the app was deleted, a cap), or {dropped} (the stream broke; the build
  // goes on on the Mac and its result goes to the chat with buddy).
  async function runBuild(body, say) {
    let r;
    try { r = await post("api/make", body); } catch (e) { return { dropped: true }; }
    if (!r.ok || !r.body) return { refused: await reply(r), status: r.status };
    try {
      const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "", got = null, failed = "";
      for (;;) {
        const { value, done: end } = await reader.read(); if (end) break;
        buf += dec.decode(value, { stream: true }); let cut;
        while ((cut = buf.indexOf("\n\n")) >= 0) {
          const ev = buf.slice(0, cut); buf = buf.slice(cut + 2);
          if (!ev.startsWith("data: ")) continue;
          const d = JSON.parse(ev.slice(6));
          if (d.s && STAGES[d.s]) say(STAGES[d.s](Number(d.p) || 0));
          if (d.error) { failed = d.error; showSpent(d); }
          if (d.done) { got = d; showSpent(d); }
        }
      }
      return got ? { got } : failed ? { failed } : { dropped: true };
    } catch (e) { return { dropped: true }; }
  }
  // The server runs one build per owner at a time, so Build it and an app's Change wait for each other.
  function setBuilding(on) { building = on; makeBtn.disabled = on || !initData; paintComposer(); }

  makeBtn.onclick = async () => {
    const text = want.value.trim(); if (!text || building || !initData) return;
    setBuilding(true); $("make-card").setAttribute("aria-busy", "true"); notice.textContent = "";
    result.hidden = true;
    const t0 = Date.now(); let words = "Starting…", spoken = "";
    const paint = () => { makeStatus.textContent = words + " " + clock(Date.now() - t0); };
    // The live region hears each stage once (not every character count); the visible line has the numbers.
    const say = (w) => { words = w; paint(); const plain = w.replace(/ \d+k$/, ""); if (plain !== spoken) { spoken = plain; makeLive.textContent = plain; } };
    const timer = setInterval(paint, 1000);
    const finish = (line) => { clearInterval(timer); makeStatus.textContent = line; makeLive.textContent = line; };
    say("Starting…");
    const out = await runBuild({ request: text }, say);
    clearInterval(timer);
    setBuilding(false); $("make-card").removeAttribute("aria-busy");
    if (out.got) {
      const got = out.got;
      finish(readyLine(got));
      if (want.value.trim() === text) want.value = "";    // words typed meanwhile for the next one are kept
      haptic(got.problems ? "warning" : "success");
      await loadApps();
      // Straight into the app only when it is clean and the owner is still here and not in the middle of
      // something else (an app's change chat, the sheet, words typed for the next build); otherwise the Open
      // button waits, so nothing they typed is lost.
      const here = () => !!initData && !sheet.open && document.visibilityState === "visible"
        && !chat && !want.value.trim();
      if (!got.problems && here()) setTimeout(() => { if (here()) openApp(got.url); else showResult(got); }, 1200);
      else showResult(got);
    } else if (out.failed) {
      finish(out.failed); haptic("error");
    } else if (out.refused) {
      finish(out.refused.error || "Something went wrong."); haptic("error");
    } else {
      finish("The connection dropped. The build goes on on the Mac; its result will come to the chat with buddy.");
      haptic("error"); loadApps();
    }
  };

  // ---- one app's change chat ----
  // Owner, 2026-09-24: "a chat box for each app where you keep refining it (make the buttons bigger, add
  // categories)". Opened by ?chat=<slug> (the Change button buddy sends after a change, and inside the app its
  // pencil or Telegram's Settings item) and by Change in the "…" sheet. It shows what was asked of the app and
  // how each build went (/api/apps/<slug>/history) and takes the next change. Requests, check lines and
  // problems are text people and Claude wrote, so they reach the page as textContent only.
  const thread = $("thread"), askBox = $("ask"), askSend = $("ask-send"), chatHint = $("chat-hint"), chatLive = $("chat-live");
  let chat = null;            // the open chat: { slug, app, thread, running, gone, fresh }
  let pending = null;         // this page's change while it runs: { slug, request, words, t0 }; its app's chat
                              // may not be the one open, so it is only ever read through mine()
  let chatPoll = null, chatTick = null;
  let drawn = "";             // what the thread was last drawn from: a poll that brings nothing new redraws nothing
  const mine = () => (pending && chat && pending.slug === chat.slug ? pending : null);
  const when = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); };
  const money = (usd) => (typeof usd === "number" && usd > 0 ? "$" + usd.toFixed(2) : "");
  const took = (secs) => (typeof secs !== "number" || secs <= 0 ? "" : secs < 60 ? secs + " s" : Math.round(secs / 60) + " min");
  const joined = (parts) => parts.filter(Boolean).join(" · ");
  function bubble(cls, line, more, meta) {
    const li = el("li", "msg " + cls);
    li.appendChild(el("span", "line", line));
    (more || []).filter(Boolean).forEach((m) => li.appendChild(el("span", "more-line", m)));
    if (meta) li.appendChild(el("span", "when", meta));
    return li;
  }
  // How one build went, in words: the version it made, what the phone check and Jev's journeys found, the
  // first thing that may still not work, and what it cost.
  function checkWords(res) {
    if (!res.tested) return "It could not be tested on a phone this time.";
    const j = res.journeys;
    if (j && j.not_run && j.ran) return "Tested on a phone; " + j.passed + " of " + j.total + " journeys passed, " + (j.total - j.ran) + " did not run.";
    if (j && j.not_run) return "Tested on a phone; its journeys did not run this time.";
    if (j) return "Tested on a phone; " + j.passed + " of " + j.total + " journeys passed.";
    return "Tested on a phone.";
  }
  function builtBubble(res) {
    const cost = joined([money(res.usd), took(res.secs)]);
    if (!res.ok) return bubble("built failed", "Couldn't change it: " + (res.reason || "the build did not finish") + ".", ["The app is unchanged."], cost);
    const line = res.version === 1 ? "Built. This is version 1." : res.version ? "Changed. This is version " + res.version + "." : "Changed.";
    const n = res.problems === 1 ? "1 thing" : res.problems + " things";
    return bubble("built", line, [checkWords(res), res.problems ? n + " may not work: " + ((res.issues && res.issues[0]) || "") : ""], cost);
  }
  function progressWords() {
    const p = mine();
    if (p) return p.words + " " + clock(Date.now() - p.t0);
    const run = chat && chat.running;
    if (!run) return "";
    if (run.secs == null) return "Being changed from the chat with buddy…";
    return (STAGES[run.stage] ? STAGES[run.stage](0) : "Changing it…") + " " + clock(Date.now() - run.t0);
  }
  // Redrawn only when what it shows changed (a poll every 4 s while a change runs must not throw away the
  // owner's place or focus), and scrolled to the newest only when the owner was already there or just sent one.
  function renderChat(toEnd) {
    if (!chat) return;
    const a = chat.app;
    $("chat-title").textContent = a.title || "This app";
    iconFor(a, $("chat-icon"));
    const asked = chat.thread.filter((i) => i.kind === "request").length;
    const spentOn = chat.thread.reduce((n, i) => n + ((i.result && i.result.usd) || 0), 0);
    $("chat-sub").textContent = chat.gone ? "Deleted" : joined([asked === 1 ? "1 request" : asked + " requests", money(spentOn) && money(spentOn) + " spent on it"]);
    $("chat-open").disabled = chat.gone || !a.open;
    $("chat-open").setAttribute("aria-label", "Open " + (a.title || "this app"));
    const run = mine() || chat.running;
    const key = JSON.stringify([chat.slug, chat.thread, chat.gone, chat.fresh, !!a.open, a.versions, run ? run.request || "" : null]);
    if (key === drawn) { paintComposer(); tickWhile(run); return; }      // (the Open link's token is new each time)
    drawn = key;
    const atEnd = toEnd || !thread.childElementCount || thread.scrollHeight - thread.scrollTop - thread.clientHeight < 40;
    const focused = thread.contains(document.activeElement) ? document.activeElement.dataset.focus : "";
    thread.textContent = "";
    if (!chat.thread.length && !run) {
      thread.appendChild(el("li", "quiet", chat.gone ? "" : "Nothing asked of it yet. Say what should change: bigger buttons, categories, a chart."));
    }
    let last = null, lastRes = null, older = false;
    chat.thread.forEach((i) => {
      if (i.kind === "undo") { thread.appendChild(bubble("note", "Undone: back to the version before its last change.", [], when(i.at))); last = null; return; }
      // a change from before results were kept: said once, so its request does not read as never answered
      if (!i.result && !older) { older = true; thread.appendChild(bubble("note", "Earlier changes show only what was asked: their results were not kept then.", [], "")); }
      thread.appendChild(bubble("asked", i.text, [], when(i.at)));
      last = null;
      if (i.result) { last = builtBubble(i.result); lastRes = i.result; thread.appendChild(last); }
    });
    // After a change made here: Open goes straight back into the app, and a change that may have broken
    // something can be undone on the spot.
    if (chat.fresh && last && lastRes.ok && a.open && !run) {
      const open = el("button", "btn", "Open " + a.title); open.type = "button"; open.dataset.focus = "open";
      open.onclick = () => openApp(a.open);
      last.appendChild(open);
      if (lastRes.problems && a.versions > 0) {
        const undo = el("button", "btn plain", "Undo this change"); undo.type = "button"; undo.dataset.focus = "undo";
        undo.onclick = async () => {
          if (!(await ask("Undo this change to " + a.title + "?", "Undo"))) return;
          undo.disabled = true;
          try {
            const res = await post("api/apps/" + encodeURIComponent(a.slug) + "/revert", { versions: a.versions });
            const j = await reply(res);
            if (chat) chat.fresh = !res.ok;
            tell(res.ok ? a.title + " is back to how it was." : (j.error || "Couldn't undo that."));
          } catch (e) { tell("The connection dropped. Try again."); undo.disabled = false; }
          loadChat(); loadApps();
        };
        last.appendChild(undo);
      }
    }
    if (run) {
      if (run.request) thread.appendChild(bubble("asked", run.request, [], ""));
      const b = bubble("built", progressWords(), [], ""); b.id = "chat-progress"; b.setAttribute("aria-busy", "true");
      thread.appendChild(b);
    }
    if (atEnd) thread.scrollTop = thread.scrollHeight;
    const back = focused && thread.querySelector('[data-focus="' + focused + '"]');
    if (back) back.focus();
    paintComposer();
    tickWhile(run);
  }
  function tickWhile(run) {
    if (run && chatTick) return;
    clearInterval(chatTick); chatTick = null;
    if (run) chatTick = setInterval(() => { const p = $("chat-progress"); if (p) p.querySelector(".line").textContent = progressWords(); }, 1000);
  }
  function paintComposer() {
    if (!chat) return;
    const busyHere = !!(mine() || chat.running);         // a change of another app from here is "another build"
    const busyElse = !busyHere && (building || running.some((b) => b.secs != null));
    askSend.disabled = !initData || chat.gone || busyHere || busyElse;
    askBox.disabled = chat.gone;
    chatHint.textContent = !initData ? "Open this from buddy's pinned message in Telegram."
      : chat.gone ? (chat.app.title || "This app") + " was deleted. Describe it again on your apps screen to build a new one."
      : busyElse ? "Another build is running. Change waits for it." : chatHint.dataset.say || "";
  }
  function tell(line) { chatHint.dataset.say = line; chatLive.textContent = line; paintComposer(); }
  async function loadChat(toEnd) {
    if (!chat || !initData) { paintComposer(); return; }
    const slug = chat.slug, was = !!chat.running;
    let r, j;
    try { r = await post("api/apps/" + encodeURIComponent(slug) + "/history"); j = await reply(r); }
    catch (e) { tell("The connection dropped. Try again."); return; }
    if (!chat || chat.slug !== slug) return;
    if (r.status === 404) { chat.gone = true; chat.running = null; }
    else if (!r.ok) { tell(j.error || "Couldn't load this app's changes."); return; }
    else {
      chat.app = j.app; chat.thread = Array.isArray(j.thread) ? j.thread : []; showSpent(j);
      chat.running = mine() ? null : (j.building || null);
      if (chat.running) chat.running.t0 = Date.now() - (chat.running.secs || 0) * 1000;
    }
    renderChat(toEnd);
    // A change this page did not start (from the chat with buddy, or before a reload): follow it until it ends.
    const waiting = !!chat.running;
    if (waiting && !chatPoll) chatPoll = setInterval(loadChat, 4000);
    if (!waiting && chatPoll) { clearInterval(chatPoll); chatPoll = null; }
    if (was && !waiting) { tell("Finished. The newest result is at the bottom."); loadApps(); }
  }
  function openChat(slug, typing) {
    const known = apps.find((x) => x.slug === slug);
    chat = { slug, app: known ? Object.assign({}, known) : { slug, title: "", icon: "" }, thread: [], running: null, gone: false, fresh: false };
    drawn = ""; clearInterval(chatTick); chatTick = null;
    delete chatHint.dataset.say;
    document.body.classList.add("chatting"); $("chat").hidden = false;
    try { history.replaceState(null, "", "?chat=" + encodeURIComponent(slug) + location.hash); } catch (e) {}
    if (can("6.1")) { tg.BackButton.onClick(closeChat); tg.BackButton.show(); }
    renderChat();
    (typing ? askBox : $("chat-title")).focus();
    return loadChat();
  }
  function closeChat() {
    if (!chat) return;
    const slug = chat.slug;
    chat = null; clearInterval(chatPoll); chatPoll = null; clearInterval(chatTick); chatTick = null;
    document.body.classList.remove("chatting"); $("chat").hidden = true;
    try { history.replaceState(null, "", location.pathname + location.hash); } catch (e) {}
    if (can("6.1")) { tg.BackButton.offClick(closeChat); tg.BackButton.hide(); }
    loadApps().then(() => {
      const back = document.querySelector('.app[data-slug="' + CSS.escape(slug) + '"] .more');
      (back && !back.disabled ? back : $("apps-heading")).focus();
    });
  }
  $("chat-back").onclick = closeChat;
  $("chat-open").onclick = () => { if (chat && chat.app.open && !chat.gone) openApp(chat.app.open); };
  function fitAsk() { askBox.style.height = "auto"; askBox.style.height = Math.min(askBox.scrollHeight + 2, 160) + "px"; }
  askBox.addEventListener("input", fitAsk);
  askBox.addEventListener("focus", () => setTimeout(() => { thread.scrollTop = thread.scrollHeight; }, 250));
  // Enter sends (the keyboard's key says "send"); Shift+Enter is a new line.
  askBox.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendChange(); }
  });
  $("composer").addEventListener("submit", (e) => { e.preventDefault(); sendChange(); });
  async function sendChange() {
    if (!chat || !initData || chat.gone || askSend.disabled) return;
    const text = askBox.value.trim(); if (!text) { askBox.focus(); return; }
    const slug = chat.slug, title = chat.app.title;
    pending = { slug, request: text, words: "Changing it…", t0: Date.now() };
    chat.fresh = false; delete chatHint.dataset.say;
    askBox.value = ""; fitAsk();
    setBuilding(true); renderChat(true);
    let spoken = "";
    const hear = (w) => {
      if (!pending) return;
      pending.words = w;
      if (!mine()) return;                               // another app's chat is open: not its news
      const p = $("chat-progress"); if (p) p.querySelector(".line").textContent = progressWords();
      const plain = w.replace(/ \d+k$/, ""); if (plain !== spoken) { spoken = plain; chatLive.textContent = plain; }
    };
    hear("Changing it…");
    const out = await runBuild({ request: text, app: slug }, hear);
    pending = null; setBuilding(false);
    const here = !!chat && chat.slug === slug;
    let line;
    if (out.got) {
      line = readyLine(out.got).replace(/^Ready/, "Changed");
      haptic(out.got.problems ? "warning" : "success");
      if (here) chat.fresh = true;
    } else if (out.refused && out.refused.gone) {
      line = (title || "The app") + " was deleted meanwhile, so nothing was changed.";
      if (here) chat.gone = true;
      haptic("error");
    } else if (out.refused) {
      line = out.refused.error || "Something went wrong.";
      if (here && !askBox.value.trim()) { askBox.value = text; fitAsk(); }   // it never started: the words come back
      haptic("error");
    } else if (out.failed) {
      line = out.failed; haptic("error");
    } else {
      line = "The connection dropped. The change goes on on the Mac; its result will come to the chat with buddy.";
      haptic("error");
    }
    if (here) {
      chatLive.textContent = line;
      // why it did not happen stays in sight under the thread (a refused key, a rate limit: the owner knows
      // whether to wait or to fix something before trying again)
      if ((out.refused && !out.refused.gone) || out.failed) chatHint.dataset.say = line;
      await loadChat(true);
    } else {
      notice.textContent = line;
      if (chat) renderChat();                            // another app's chat: its composer is free again
    }
    loadApps();
  }
  // The phone's keyboard shrinks the visible area; the page follows it so the composer stays above the keys.
  const vv = window.visualViewport;
  if (vv) {
    const fit = () => document.documentElement.style.setProperty("--app-h", Math.round(vv.height * (vv.scale || 1)) + "px");
    vv.addEventListener("resize", fit); fit();
  }
  // Settings in Telegram's "…" menu belongs to an app (it leads to the app's change chat); not here.
  try { if (can("7.0") && tg.SettingsButton) tg.SettingsButton.hide(); } catch (e) {}

  loadApps().then(() => {
    if (chatting) { openChat(chatting, false); return; }
    if (!opening) return;
    const a = apps.find((x) => x.slug === opening);
    if (a) openApp(a.open, true);
    else notice.textContent = "That app is no longer here. It may have been deleted.";
  });
  window.addEventListener("pageshow", (e) => { if (e.persisted) { loadApps(); if (chat) loadChat(); } });

})();
</script>
</body>
</html>
