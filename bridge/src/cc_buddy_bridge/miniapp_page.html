<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>buddy</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1b1b1f);
    --hint: var(--tg-theme-hint-color, #8a8a92);
    --link: var(--tg-theme-link-color, #2f6fde);
    --accent: var(--tg-theme-button-color, #2f6fde);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --bubble: var(--tg-theme-secondary-bg-color, #f1f1f4);
    --code: rgba(127, 127, 127, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--tg-theme-bg-color, #17171b); --text: var(--tg-theme-text-color, #ececf1);
      --hint: var(--tg-theme-hint-color, #8d8d96); --bubble: var(--tg-theme-secondary-bg-color, #232329);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 16px; border-bottom: 1px solid var(--code); }
  header .who { font-weight: 600; }
  header .left { color: var(--hint); font-size: 13px; }
  header button { background: none; border: 0; color: var(--link); font: inherit; padding: 6px 0; }
  main { flex: 1; overflow-y: auto; padding: 12px 16px 4px; -webkit-overflow-scrolling: touch; }
  .empty { color: var(--hint); text-align: center; margin-top: 30vh; }
  .msg { margin: 0 0 14px; overflow-wrap: anywhere; }
  .msg.user { margin-left: 18%; background: var(--accent); color: var(--accent-text);
    padding: 8px 12px; border-radius: 16px 16px 4px 16px; white-space: pre-wrap; }
  .msg.assistant p { margin: 0 0 10px; }
  .msg.assistant h1, .msg.assistant h2, .msg.assistant h3 { font-size: 17px; margin: 14px 0 6px; }
  .msg.assistant ul, .msg.assistant ol { margin: 0 0 10px; padding-left: 22px; }
  .msg.assistant code { background: var(--code); padding: 1px 5px; border-radius: 5px;
    font: 14px ui-monospace, "SF Mono", Menlo, monospace; }
  .msg.assistant pre { background: var(--code); padding: 10px 12px; border-radius: 10px; overflow-x: auto; margin: 0 0 10px; }
  .msg.assistant pre code { background: none; padding: 0; }
  .msg.assistant a { color: var(--link); }
  .msg .note, .msg.error { color: var(--hint); font-size: 14px; }
  .typing { color: var(--hint); }
  form { display: flex; gap: 8px; align-items: flex-end; padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--code); background: var(--bg); }
  textarea { flex: 1; resize: none; max-height: 40vh; border: 1px solid var(--code); border-radius: 18px;
    padding: 9px 14px; background: var(--bubble); color: var(--text); font: inherit; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  form button { border: 0; border-radius: 18px; background: var(--accent); color: var(--accent-text);
    font: 600 15px system-ui, sans-serif; padding: 10px 16px; min-height: 40px; }
  form button:focus-visible, header button:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  form button:disabled { opacity: 0.5; }
  .tabs { display: flex; gap: 4px; background: var(--bubble); border-radius: 10px; padding: 3px; }
  .tabs button { border: 0; background: none; color: var(--text); font: 600 14px system-ui, sans-serif;
    padding: 7px 14px; border-radius: 8px; min-height: 34px; }
  .tabs button[aria-selected="true"] { background: var(--bg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .tabs button:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }
  [hidden] { display: none !important; }
  #apps { flex: 1; overflow-y: auto; padding: 16px; }
  .make { background: var(--bubble); border-radius: 16px; padding: 14px; margin-bottom: 18px; }
  .make label { display: block; font-weight: 600; margin-bottom: 8px; }
  .make textarea { width: 100%; min-height: 64px; background: var(--bg); }
  .make .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; }
  .make .row span { color: var(--hint); font-size: 13px; }
  .btn { border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-text);
    font: 600 15px system-ui, sans-serif; padding: 10px 16px; min-height: 44px; }
  .btn:disabled { opacity: .5; }
  .btn:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .ideas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .ideas button { border: 1px solid var(--code); background: var(--bg); color: var(--text); border-radius: 999px;
    padding: 6px 12px; font: 14px system-ui, sans-serif; min-height: 34px; }
  h2.section { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); margin: 0 0 8px; }
  .app { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: var(--bubble);
    margin-bottom: 8px; }
  .app .icon { width: 44px; height: 44px; border-radius: 12px; background: var(--accent); color: var(--accent-text);
    display: grid; place-items: center; font: 700 19px system-ui, sans-serif; flex: none; }
  .app .name { font-weight: 600; }
  .app .when { color: var(--hint); font-size: 13px; }
  .app .open { flex: 1; min-width: 0; background: none; border: 0; text-align: left; color: inherit; font: inherit;
    display: flex; align-items: center; gap: 12px; padding: 0; min-height: 44px; }
  .app .change { background: none; border: 0; color: var(--link); font: 15px system-ui, sans-serif; min-height: 44px; padding: 0 4px; }
  .none { color: var(--hint); }
</style>
</head>
<body>
<header>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-apps" aria-selected="true">Apps</button>
    <button type="button" role="tab" id="tab-chat" aria-selected="false">Chat</button>
  </div>
  <div class="left" id="left" role="status" aria-live="polite"></div>
  <button type="button" id="new" hidden>New chat</button>
</header>
<section id="apps" role="tabpanel" aria-labelledby="tab-apps">
  <div class="make">
    <label for="want" id="want-label">What should I build?</label>
    <textarea id="want" rows="2" placeholder="A habit tracker with daily check-ins and streaks"></textarea>
    <div class="ideas" id="ideas">
      <button type="button">Habit tracker with streaks</button>
      <button type="button">Workout log</button>
      <button type="button">Reading list</button>
      <button type="button">Expense splitter</button>
    </div>
    <div class="row"><span id="make-status" role="status" aria-live="polite"></span>
      <button class="btn" id="make" type="button">Build it</button></div>
  </div>
  <h2 class="section">Your apps</h2>
  <div id="app-list"><div class="none">Nothing yet. Describe one above.</div></div>
</section>
<main id="log" hidden aria-live="polite"><div class="empty" id="empty">Ask anything. Answers stream in full.</div></main>
<form id="form" hidden>
  <textarea id="q" rows="1" placeholder="Message Claude" aria-label="Message Claude"></textarea>
  <button id="send" type="submit">Send</button>
</form>
<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const initData = tg ? tg.initData : "";
  if (tg) { tg.ready(); tg.expand(); }
  const $ = (id) => document.getElementById(id);
  const log = $("log"), q = $("q"), send = $("send"), left = $("left");
  const KEY = "buddy-claude-history";
  let history = [];
  try { history = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { history = []; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(history.slice(-80))); } catch (e) {} };

  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  function md(src) {
    const out = [], lines = src.split("\n");
    let i = 0, para = [];
    const flush = () => { if (para.length) { out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; } };
    while (i < lines.length) {
      const ln = lines[i];
      if (/^```/.test(ln)) {
        flush(); const code = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
        i++; out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>"); continue;
      }
      const h = ln.match(/^(#{1,3})\s+(.*)/);
      if (h) { flush(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
      if (/^\s*([-*]|\d+\.)\s+/.test(ln)) {
        flush(); const ordered = /^\s*\d+\./.test(ln), items = [];
        while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ""));
        const t = ordered ? "ol" : "ul"; out.push(`<${t}>` + items.map((x) => "<li>" + inline(x) + "</li>").join("") + `</${t}>`); continue;
      }
      if (!ln.trim()) { flush(); i++; continue; }
      para.push(ln); i++;
    }
    flush(); return out.join("");
  }

  function bubble(role, text) {
    $("empty") && $("empty").remove();
    const el = document.createElement("div");
    el.className = "msg " + role;
    if (role === "assistant") el.innerHTML = md(text); else el.textContent = text;
    log.appendChild(el); return el;
  }
  const bottom = () => { log.scrollTop = log.scrollHeight; };
  const showLeft = (v) => { if (typeof v === "number") left.textContent = "$" + v.toFixed(2) + " left today"; };
  history.forEach((t) => bubble(t.role, t.content)); bottom();

  if (!initData) { left.textContent = "Open this from buddy's menu button in Telegram."; send.disabled = true; }
  else fetch("api/me", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ initData }) })
    .then((r) => r.json()).then((j) => { if (j.error) left.textContent = j.error; else showLeft(j.left); }).catch(() => {});

  // ---- tabs ----
  const views = { apps: [$("apps")], chat: [log, $("form"), $("new")] };
  function show(which) {
    ["apps", "chat"].forEach((v) => { const on = v === which;
      $("tab-" + v).setAttribute("aria-selected", String(on)); views[v].forEach((el) => { el.hidden = !on; }); });
    try { localStorage.setItem("buddy-tab", which); } catch (e) {}
    if (which === "chat") bottom();
  }
  $("tab-apps").onclick = () => show("apps");
  $("tab-chat").onclick = () => show("chat");
  let startTab = "apps"; try { startTab = localStorage.getItem("buddy-tab") || "apps"; } catch (e) {}
  show(startTab === "chat" ? "chat" : "apps");

  // ---- apps ----
  const want = $("want"), makeBtn = $("make"), makeStatus = $("make-status");
  let editing = null;                                   // the app being changed, or null for a new one
  const ago = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString(undefined, { month: "short", day: "numeric" }); };
  async function post(path, body) {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ initData }, body || {})) });
    return r;
  }
  async function loadApps() {
    if (!initData) return;
    try {
      const j = await (await post("api/apps")).json();
      const list = $("app-list"); list.innerHTML = "";
      if (!j.apps || !j.apps.length) { list.innerHTML = '<div class="none">Nothing yet. Describe one above.</div>'; return; }
      j.apps.forEach((a) => {
        const row = document.createElement("div"); row.className = "app";
        row.innerHTML = '<button class="open" type="button"><span class="icon"></span><span><div class="name"></div>' +
          '<div class="when"></div></span></button><button class="change" type="button">Change</button>';
        row.querySelector(".icon").textContent = (a.title || "?").trim().charAt(0).toUpperCase();
        row.querySelector(".name").textContent = a.title;
        row.querySelector(".when").textContent = "Updated " + ago(a.updated);
        row.querySelector(".open").onclick = () => { location.href = "apps/" + a.slug + "/"; };
        row.querySelector(".change").onclick = () => {
          editing = a; $("want-label").textContent = "What should change in " + a.title + "?";
          want.placeholder = "Add a weekly chart"; makeBtn.textContent = "Change it"; want.focus();
        };
        list.appendChild(row);
      });
    } catch (e) {}
  }
  $("ideas").querySelectorAll("button").forEach((b) => { b.onclick = () => { want.value = b.textContent; want.focus(); }; });
  makeBtn.onclick = async () => {
    const text = want.value.trim(); if (!text || makeBtn.disabled || !initData) return;
    makeBtn.disabled = true; makeStatus.textContent = editing ? "Changing it…" : "Building it… this takes about a minute.";
    try {
      const r = await post("api/make", editing ? { request: text, app: editing.slug } : { request: text });
      if (!r.ok || !r.body) { let m = "Something went wrong."; try { m = (await r.json()).error || m; } catch (x) {} makeStatus.textContent = m; return; }
      const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "", result = null;
      for (;;) {
        const { value, done } = await reader.read(); if (done) break;
        buf += dec.decode(value, { stream: true }); let cut;
        while ((cut = buf.indexOf("\n\n")) >= 0) {
          const ev = buf.slice(0, cut); buf = buf.slice(cut + 2);
          if (!ev.startsWith("data: ")) continue;
          const d = JSON.parse(ev.slice(6));
          if (typeof d.p === "number") makeStatus.textContent = d.p ? "Writing it… " + Math.round(d.p / 100) / 10 + "k characters" : "Thinking it through…";
          if (d.error) makeStatus.textContent = d.error;
          if (d.done) { result = d; showLeft(d.left); }
        }
      }
      if (result) {
        makeStatus.textContent = "Ready: " + result.app.title; want.value = "";
        editing = null; $("want-label").textContent = "What should I build?"; makeBtn.textContent = "Build it";
        await loadApps(); setTimeout(() => { location.href = result.url.replace(/^\//, ""); }, 600);
      }
    } catch (e) { makeStatus.textContent = "The connection dropped. Check Your apps in a minute."; }
    finally { makeBtn.disabled = false; }
  };
  loadApps();

  $("new").onclick = () => { history = []; save(); log.innerHTML = '<div class="empty" id="empty">New chat.</div>'; q.focus(); };
  q.addEventListener("input", () => { q.style.height = "auto"; q.style.height = q.scrollHeight + "px"; });
  q.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !("ontouchstart" in window)) { e.preventDefault(); $("form").requestSubmit(); } });

  $("form").onsubmit = async (e) => {
    e.preventDefault();
    const text = q.value.trim(); if (!text || send.disabled) return;
    q.value = ""; q.style.height = "auto"; send.disabled = true;
    history.push({ role: "user", content: text }); save(); bubble("user", text);
    const el = bubble("assistant", ""); el.innerHTML = '<span class="typing">Thinking…</span>'; bottom();
    let answer = "";
    try {
      const r = await fetch("api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ initData, messages: history }) });
      if (!r.ok || !r.body) {
        let msg = "Something went wrong."; try { msg = (await r.json()).error || msg; } catch (x) {}
        el.className = "msg error"; el.textContent = msg; return;
      }
      const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "";
      for (;;) {
        const { value, done } = await reader.read(); if (done) break;
        buf += dec.decode(value, { stream: true });
        let cut;
        while ((cut = buf.indexOf("\n\n")) >= 0) {
          const ev = buf.slice(0, cut); buf = buf.slice(cut + 2);
          if (!ev.startsWith("data: ")) continue;
          const d = JSON.parse(ev.slice(6));
          if (d.t) { answer += d.t; el.innerHTML = md(answer); bottom(); }
          if (d.error) { el.insertAdjacentHTML("beforeend", '<div class="note">' + esc(d.error) + "</div>"); }
          if (d.done) { showLeft(d.left); if (d.note) el.insertAdjacentHTML("beforeend", '<div class="note">' + esc(d.note) + "</div>"); }
        }
      }
    } catch (x) {
      el.insertAdjacentHTML("beforeend", '<div class="note">The connection dropped.</div>');
    } finally {
      if (answer) { history.push({ role: "assistant", content: answer }); save(); }
      else if (!el.textContent.trim() || el.querySelector(".typing")) { el.className = "msg error"; el.textContent = el.textContent.replace("Thinking…", "") || "No answer."; }
      send.disabled = false; bottom();
    }
  };
})();
</script>
</body>
</html>
