# xcodegen spec — regenerate the .xcodeproj with `xcodegen generate` from this directory (build.sh does).
# Team SJ8BKXTNUS is the owner's, as in widget/project.yml.
name: BuddyLink
options:
  bundleIdPrefix: com.github.cc-buddy-bridge
  deploymentTarget:
    iOS: "18.0"
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptySchemes: false
settings:
  base:
    DEVELOPMENT_TEAM: SJ8BKXTNUS
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
targets:
  BuddyLink:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Buddy Link
        CFBundleName: BuddyLink
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: Buddy Link talks to your buddy stick over Bluetooth, also while the phone is locked.
        UIBackgroundModes: [bluetooth-central]
        CFBundleURLTypes:
          - CFBundleURLName: com.github.cc-buddy-bridge.BuddyLink
            CFBundleURLSchemes: [buddylink]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.cc-buddy-bridge.BuddyLink
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: App/Info.plist
  BuddyProbe:
    type: application
    platform: macOS
    sources:
      - path: Probe
      - path: Shared
    info:
      path: Probe/Info.plist
      properties:
        CFBundleName: BuddyProbe
        CFBundleIdentifier: com.github.cc-buddy-bridge.BuddyProbe
        CFBundleExecutable: BuddyProbe
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSBluetoothAlwaysUsageDescription: BuddyProbe stands in for the phone to test the buddy stick on the bench.
    entitlements:
      path: Probe/BuddyProbe.entitlements
      properties:
        com.apple.security.device.bluetooth: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.cc-buddy-bridge.BuddyProbe
        ENABLE_HARDENED_RUNTIME: NO
